[package]
name = "stellar-alerts-webhook"
version = "0.2.0"
edition = "2021"
description = "Stellar Alerts webhook signature verification SDK"
license = "MIT"

[dependencies]
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2.5"
ed25519-dalek = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
